events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format log custom untuk memantau upstream mana yang menangani request
    log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                'upstream_addr="$upstream_addr" '
                                'upstream_status="$upstream_status" '
                                'request_time=$request_time';

    access_log /var/log/nginx/access.log upstream_logging;

    upstream eversnap_web {
        # Docker DNS mendistribusikan ke semua kontainer 'web'
        server web:5000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Menyajikan file statis /uploads langsung oleh Nginx
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Mengarahkan semua request API & routing lainnya ke Flask
        location / {
            proxy_pass http://eversnap_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
        }
    }
}
